apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasks-api.name" . }}
  labels:
    {{- include "tasks-api.labels" . | nindent 4 }}
spec:
  # ClusterIP by default (internal-only) — staging overrides this to
  # LoadBalancer via values-staging.yaml so the DAST job (which runs on a
  # GitHub-hosted runner outside the VPC) and demo access have a reachable
  # public endpoint. Production should stay internal, fronted by an
  # Ingress/ALB, once one exists — do not default this to LoadBalancer.
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "tasks-api.selectorLabels" . | nindent 4 }}
