apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasks-api.name" . }}
  labels:
    {{- include "tasks-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "tasks-api.selectorLabels" . | nindent 4 }}
