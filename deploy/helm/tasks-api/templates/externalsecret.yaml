{{- if .Values.externalSecret.enabled }}
# Requires the External Secrets Operator installed on the cluster
# (github.com/external-secrets/external-secrets) with a SecretStore/
# ClusterSecretStore already pointed at AWS Secrets Manager. Syncs the
# connection string Terraform wrote (infra/terraform/modules/rds) into a
# native Kubernetes Secret the deployment mounts — the app and this chart
# never see the value in plaintext at rest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tasks-api.name" . }}-db
  labels:
    {{- include "tasks-api.labels" . | nindent 4 }}
  annotations:
    # Must exist (and have synced) before the migration Job hook below
    # runs, since that Job reads its env vars from the Secret this
    # resource creates — so it's a hook too, at a lower weight, rather
    # than a regular chart resource Helm wouldn't apply until afterward.
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ include "tasks-api.name" . }}-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretArn }}
{{- end }}
