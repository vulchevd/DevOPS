name: CD

# Only runs on main, and only after every ci.yml check has already passed
# for that commit (branch protection requires ci.yml's jobs as required
# checks before merge is even allowed). This workflow is what actually
# touches shared infrastructure and live traffic.
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # OIDC federation to AWS — no long-lived access keys in secrets

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: tasks-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-scan:
    name: Build, scan, push
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
      image: ${{ steps.image.outputs.app }}
      migrate_image: ${{ steps.image.outputs.migrate }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build app image
        run: docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./app
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}

      # Gate: the job stops here on a critical/unpatched CVE, so a bad image
      # never reaches the next step, let alone ECR or the cluster.
      - name: "Container image scan · Trivy"
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          format: sarif
          output: trivy-app.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-app.sarif

      - name: Push app image
        run: docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}

      - name: Build migration image
        run: docker build -t "$REGISTRY/$ECR_REPOSITORY:migrate-$IMAGE_TAG" ./db
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}

      - name: "Migration image scan · Trivy"
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:migrate-${{ env.IMAGE_TAG }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push migration image
        run: docker push "$REGISTRY/$ECR_REPOSITORY:migrate-$IMAGE_TAG"
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}

      - id: image
        run: |
          echo "app=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
          echo "migrate=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:migrate-${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to staging
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name tasks-staging --region "$AWS_REGION"
      - uses: azure/setup-helm@v4
      - name: Migrate + rolling deploy
        run: |
          helm upgrade --install tasks-api ./deploy/helm/tasks-api \
            -f deploy/helm/tasks-api/values-staging.yaml \
            --namespace tasks-api --create-namespace \
            --set image.repository="${{ needs.build-and-scan.outputs.registry }}/${{ env.ECR_REPOSITORY }}" \
            --set image.tag="${{ env.IMAGE_TAG }}" \
            --set migrationJob.repository="${{ needs.build-and-scan.outputs.registry }}/${{ env.ECR_REPOSITORY }}" \
            --set externalSecret.secretArn="${{ secrets.STAGING_DB_SECRET_ARN }}" \
            --wait --timeout 5m
      - run: kubectl rollout status deployment/tasks-api -n tasks-api

  dast-scan:
    name: "DAST · OWASP ZAP baseline"
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Baseline scan against staging
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.STAGING_URL }}
          cmd_options: "-a"
        # Non-blocking by default (zaproxy/action-baseline exits 0 on WARN):
        # findings post as a PR/workflow annotation for review before the
        # manual promote step below, rather than hard-failing the pipeline.

  promote-prod:
    name: Promote to production
    needs: [build-and-scan, dast-scan]
    runs-on: ubuntu-latest
    # Requires the "production" GitHub Environment to have required
    # reviewers configured (Settings → Environments) — that's the manual
    # approval gate; nothing in this file grants it automatically.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name tasks-prod --region "$AWS_REGION"
      - uses: azure/setup-helm@v4
      - run: |
          helm upgrade --install tasks-api ./deploy/helm/tasks-api \
            -f deploy/helm/tasks-api/values-prod.yaml \
            --namespace tasks-api --create-namespace \
            --set image.repository="${{ needs.build-and-scan.outputs.registry }}/${{ env.ECR_REPOSITORY }}" \
            --set image.tag="${{ env.IMAGE_TAG }}" \
            --set migrationJob.repository="${{ needs.build-and-scan.outputs.registry }}/${{ env.ECR_REPOSITORY }}" \
            --set externalSecret.secretArn="${{ secrets.PROD_DB_SECRET_ARN }}" \
            --wait --timeout 5m
      - run: kubectl rollout status deployment/tasks-api -n tasks-api
